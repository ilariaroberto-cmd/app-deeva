  --coral-light: #FF7A68;
  --sky: #5FAFFF;
  --burgundy: #914C49;
  --cream: #FFECD3;
  --ink: #1A1410;
  --font: "Formiga", "Nunito", "Poppins", system-ui, sans-serif;
  --tile-shadow: 0 10px 24px -12px color-mix(in oklab, #ff5740 45%, transparent);
  --sheet: #FFFFFF;
  --hint: #FFF1DF;
  --coral-hover: #FF7060;
  --soft: #FFEEEC;
  --line: #EFE4D6;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1410; --fg: #FFF1DF; --muted: #C2B6A8; --ink: #3A2F28; --sheet: #251D18; --hint: #3A2F28; --coral-hover: #FF8070; --soft: #3A221D; --line: #3A2F28;
  --tile-shadow: 0 10px 24px -12px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1A1410; --fg: #FFF1DF; --muted: #C2B6A8; --ink: #3A2F28; --sheet: #251D18; --hint: #3A2F28; --coral-hover: #FF8070; --soft: #3A221D; --line: #3A2F28;
  --tile-shadow: 0 10px 24px -12px rgba(0,0,0,.7); color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--font); }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 48px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 40px; }

header { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.logo { width: 132px; color: var(--coral); }
.logo svg { width: 100%; height: auto; display: block; }
.tag { margin: 0; font-size: 15px; color: var(--muted); }

.home { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px 12px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: var(--fg);
  border-radius: 20px; padding: 4px 0; -webkit-tap-highlight-color: transparent; }
.tile { width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; overflow: hidden;
  box-shadow: var(--tile-shadow); transition: transform .15s ease; }
.tile svg { width: 40px; height: 40px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile img.mark { width: 64%; height: auto; object-fit: contain; filter: brightness(0) invert(1); }
.name { font-size: 13px; font-weight: 700; line-height: 1.2; text-align: center; text-wrap: balance; max-width: 96px; }
.app:hover .tile { transform: translateY(-3px); }
.app:active .tile { transform: scale(.95); }
.app:focus-visible { outline: 3px solid color-mix(in oklab, var(--coral) 45%, transparent); outline-offset: 4px; }

.t-coral { background: var(--coral); }
.t-light { background: var(--coral-light); }
.t-sky { background: var(--sky); }
.t-burgundy { background: var(--burgundy); }
.t-ink { background: var(--ink); }
.t-cream { background: var(--cream); }
.edge { outline: 1px solid color-mix(in oklab, var(--coral) 25%, transparent); outline-offset: -1px; }
.t-cream svg { stroke: var(--burgundy); }

footer { font-size: 13px; color: var(--muted); text-align: center; }

@media (max-width: 360px) { .home { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .app:hover .tile { transform: none; } }
</style>

<style>
/* Schermata «Aggiungi a Home» alla prima apertura: stessa forma di quella di DeevaPro

[hidden] { display: none !important; }
.gate { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.gate-scr { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 22px;
  padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
.gate-hero { background: var(--coral); color: #fff; border-radius: 0 0 32px 32px;
  padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: 40px;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.gate-logo { width: 96px; color: #fff; }
.gate-logo svg { width: 100%; height: auto; display: block; }
.gate-hero h1 { margin: 0; color: #fff; font-size: 31px; line-height: 1.16; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
.gate-hero p { margin: 0; font-size: 17px; line-height: 1.45; color: #FFE6E1; }
.gate-body { margin-top: -22px; display: flex; flex-direction: column; gap: 14px;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.gate-card { background: var(--sheet); border-radius: 26px; box-shadow: 0 18px 50px -24px color-mix(in oklab, #ff5740 40%, transparent);
  padding: 22px; display: flex; flex-direction: column; gap: 20px; }
.gstep { display: flex; gap: 16px; align-items: flex-start; }
.gstep + .gstep { border-top: 1px solid var(--line); padding-top: 20px; }
.gnum { width: 38px; height: 38px; border-radius: 999px; background: var(--soft); color: var(--coral); flex-shrink: 0;
  display: grid; place-items: center; font-weight: 700; font-size: 17px; }
.gtext { flex: 1; min-width: 0; }
.gtext b { display: block; font-size: 17px; font-weight: 700; line-height: 1.35; }
.gtext span { display: block; color: var(--muted); font-size: 15px; line-height: 1.4; margin-top: 3px; }
.gicon { flex-shrink: 0; color: var(--coral); width: 30px; height: 30px; }
.gicon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

.gicon.app img { width: 70%; height: auto; filter: brightness(0) invert(1); }
.ginstall { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
.ginstall b { font-size: 17px; line-height: 1.35; }
.ginstall span { color: var(--muted); font-size: 15px; line-height: 1.4; }
.ginstall .gor { margin-top: 4px; }
.gcopy { border-top: 1px solid var(--line); padding-top: 20px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: center; }
.gcta { border: 0; border-radius: 999px; background: var(--coral); color: #fff; font: inherit; font-weight: 700; font-size: 16px; padding: 14px 20px; cursor: pointer; }
.gcta:hover { background: var(--coral-hover); }
.gaddr { font-size: 14px; color: var(--muted); word-break: break-all; user-select: all; }
.gbanner { display: flex; gap: 12px; align-items: flex-start; background: var(--hint); border-radius: 20px; padding: 14px 16px; font-size: 14px; line-height: 1.45; }
.gbanner svg { width: 21px; height: 21px; flex-shrink: 0; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; }
.gbanner p { margin: 0; flex: 1; }
.gate-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; text-align: center;
  padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
.glink { border: 0; background: none; font: inherit; font-size: 16px; font-weight: 700; color: var(--coral); cursor: pointer; padding: 8px; }
.gate-foot p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
.gcta:focus-visible, .glink:focus-visible, .again:focus-visible { outline: 3px solid color-mix(in oklab, var(--coral) 45%, transparent); outline-offset: 2px; }
.again { border: 0; background: none; color: var(--coral); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px; }

<script>
(function () {
  var LINK = 'https://ilariaroberto-cmd.github.io/app-deeva/';
  var MARK = document.querySelector('.tile img.mark');
  var ICONS = {
    share: '<svg viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/></svg>',
    plus: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>',
    check: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.5 2.5 5-5.2"/></svg>',
    dots: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="12" cy="18.5" r=".9"/></svg>',
    copy: '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
    phone: '<svg viewBox="0 0 24 24"><rect x="6.5" y="3" width="11" height="18" rx="2.5"/><path d="M10.5 18h3"/></svg>'
  };
  var APRI = ['app', 'Apri l’icona appena comparsa', 'Da qui in poi entra sempre da lì: trovi tutte le app di Deeva con un tocco.'];
  var SAFARI = ['plus', 'Da Safari: Condividi, poi «Aggiungi a Home», poi «Aggiungi»', 'Sono tre tocchi: l’ultimo è il pulsante Aggiungi in alto a destra.'];

  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/i.test(ua);
  var inApp = /FBAN|FBAV|Instagram|WhatsApp|GSA\/|Line\//i.test(ua) || (android && /; wv\)/.test(ua));
  var iosOther = ios && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  var androidOther = android && (/SamsungBrowser|Firefox|OPR|EdgA|MiuiBrowser/i.test(ua) || !/Chrome\//i.test(ua));
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  var g;
  if (ios && inApp) {
    g = { t: 'Apri questa pagina in Safari', s: 'La stai guardando dentro un’altra app. Da qui l’iPhone non lascia aggiungere niente alla Home.', copy: true, p: [
      ['dots', 'Apri il menu dell’app che stai usando', 'In WhatsApp e Instagram è in basso a destra; in Gmail e negli altri di solito in alto a destra.'],
      ['share', 'Scegli «Apri in Safari»', 'A volte si chiama «Apri nel browser», o è l’icona della bussola.'], SAFARI, APRI],
      n: 'Se non trovi quella voce, copia l’indirizzo qui sopra, apri Safari e incollalo nella barra in alto.' };
  } else if (iosOther) {
    g = { t: 'Sull’iPhone si aggiunge solo da Safari', s: 'Chrome, Firefox ed Edge sull’iPhone non hanno la voce «Aggiungi a Home». È una regola di Apple, non una scelta nostra.', copy: true, p: [
      ['copy', 'Copia l’indirizzo di questa pagina', 'Con il pulsante qui sotto.'],
      ['share', 'Apri Safari e incollalo nella barra in alto', 'Safari è l’app con la bussola, quella che l’iPhone ha già installata.'], SAFARI, APRI] };
  } else if (ios) {
    g = { t: 'Aggiungi le app di Deeva alla schermata Home', s: 'Serve una volta sola. Poi le trovi tra le app del telefono, senza cercare il link.', p: [
      ['share', 'Tocca Condividi', 'È l’icona con la freccia verso l’alto: nella barra in basso, oppure in alto a destra se hai la barra degli indirizzi in alto (su iPad è sempre in alto).'],
      ['plus', 'Scegli «Aggiungi a Home»', 'Scorri l’elenco verso il basso: sta sotto le app di condivisione.'],
      ['check', 'Conferma con «Aggiungi»', 'In alto a destra nella schermata che si apre. Lì puoi anche cambiare il nome sotto l’icona, per esempio «App Deeva».'], APRI],
      n: 'Non vedi «Aggiungi a Home»? Vuol dire che stai guardando la pagina dentro un’altra app (WhatsApp, Instagram, Gmail). Cerca «Apri in Safari» nel menu di quell’app e ricomincia da qui.' };
  } else if (android && (inApp || androidOther)) {
    g = { t: 'Apri questa pagina con Chrome', s: 'Su Android seguiamo Chrome: è quello di cui possiamo darti istruzioni precise, ed è già installato sul tuo telefono.', copy: true, p: [
      ['copy', 'Copia l’indirizzo di questa pagina', 'Con il pulsante qui sotto.'],
      ['share', 'Apri Chrome e incollalo nella barra in alto', 'È l’app col cerchio rosso, giallo e verde.'],
      ['plus', 'Da Chrome: menu ⋮, poi «Aggiungi a schermata Home»', 'I tre puntini in alto a destra. Poi conferma con «Aggiungi».'], APRI] };
  } else if (android) {
    g = { t: 'Aggiungi le app di Deeva alla schermata Home', s: 'Serve una volta sola. Poi le trovi tra le app del telefono, senza cercare il link.', p: [
      ['dots', 'Tocca il menu ⋮', 'I tre puntini in alto a destra.'],
      ['plus', 'Scegli «Aggiungi a schermata Home»', 'In alcune versioni si chiama «Installa app».'],
      ['check', 'Conferma con «Aggiungi»', 'Compare una finestrella con il nome e l’icona: puoi chiamarla «App Deeva» e confermare.'], APRI],
      n: 'Non trovi la voce nel menu? Ricarica la pagina e riprova: il browser la mostra solo dopo aver caricato la pagina per intero.' };
  } else {
    g = { t: 'Aggiungi le app di Deeva alla schermata Home', s: 'Si fa dal telefono: apri questa pagina lì e ti diciamo cosa toccare.', copy: true, p: [
      ['copy', 'Copia l’indirizzo di questa pagina', 'Con il pulsante qui sotto, e mandatelo su WhatsApp o via mail.'],
      ['phone', 'Aprilo dal telefono', 'La pagina riconosce se hai un iPhone o un Android e ti mostra i passi giusti.']] };
  }

  document.getElementById('gateTitle').textContent = g.t;
  document.getElementById('gateSub').textContent = g.s;
  var card = document.getElementById('gateCard');
  g.p.forEach(function (st, i) {
    var row = document.createElement('div'); row.className = 'gstep';
    var num = document.createElement('span'); num.className = 'gnum'; num.textContent = String(i + 1);
    var tx = document.createElement('div'); tx.className = 'gtext';
    var b = document.createElement('b'); b.textContent = st[1];
    var sp = document.createElement('span'); sp.textContent = st[2];
    tx.appendChild(b); tx.appendChild(sp);
    var ic = document.createElement('span'); ic.setAttribute('aria-hidden', 'true');
    if (st[0] === 'app') {
      ic.className = 'gicon app';
      if (MARK) { var im = document.createElement('img'); im.src = MARK.src; im.alt = ''; ic.appendChild(im); }
    } else { ic.className = 'gicon'; ic.innerHTML = ICONS[st[0]]; }
    row.appendChild(num); row.appendChild(tx); row.appendChild(ic); card.appendChild(row);
  });
  if (g.copy) {
    var box = document.createElement('div'); box.className = 'gcopy';
    var btn = document.createElement('button'); btn.className = 'gcta'; btn.type = 'button'; btn.textContent = 'Copia l’indirizzo di questa pagina';
    var addr = document.createElement('span'); addr.className = 'gaddr'; addr.textContent = LINK.replace('https://', '');
    btn.addEventListener('click', function () {
      var ok = function () { btn.textContent = 'Indirizzo copiato'; addr.textContent = 'Ora incollalo nel browser'; };
      var fallback = function () {
        var r = document.createRange(); r.selectNodeContents(addr);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        btn.textContent = 'Tieni premuto l’indirizzo e copialo';
      };
      try { navigator.clipboard.writeText(LINK).then(ok, fallback); } catch (e) { fallback(); }
    });
    box.appendChild(btn); box.appendChild(addr); card.appendChild(box);
  }
  if (g.n) { document.getElementById('gateBannerText').textContent = g.n; document.getElementById('gateBanner').hidden = false; }

  var gate = document.getElementById('gate');
  var KEY = 'deeva-app-home-guida-vista';
  function seen() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function remember() { try { localStorage.setItem(KEY, '1'); } catch (e) {} }
  function open() { gate.hidden = false; gate.scrollTop = 0; document.getElementById('gateDone').focus({ preventScroll: true }); }
  function close() { gate.hidden = true; remember(); }
  document.getElementById('gateDone').addEventListener('click', close);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !gate.hidden) { close(); } });
  var again = document.getElementById('homeAgain');
  if (again) { again.addEventListener('click', open); }


  // Su Android Chrome il browser sa installare da solo: come DeevaPro, un pulsante in cima ai passi.
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (document.getElementById('gateInstall')) return;
    var box = document.createElement('div'); box.id = 'gateInstall'; box.className = 'ginstall';
    box.innerHTML = '<b>Installa in un tocco</b><span>Il tuo browser può farlo da solo: tocca il pulsante e conferma.</span>';
    var btn = document.createElement('button'); btn.className = 'gcta'; btn.type = 'button'; btn.textContent = 'Installa App Deeva';
    btn.addEventListener('click', function () {
      if (!deferred) return;
      deferred.prompt();
      deferred.userChoice.then(function (r) { if (r.outcome === 'accepted') { close(); } box.remove(); deferred = null; });
    });
    var note = document.createElement('span'); note.className = 'gor'; note.textContent = 'Se il pulsante non funziona, fallo a mano:';
    box.appendChild(btn); box.appendChild(note);
    card.insertBefore(box, card.firstChild);
  });
  window.addEventListener('appinstalled', function () { close(); });

  // Come DeevaPro: alla prima apertura dal telefono la schermata viene prima delle app.
  if (!standalone && !seen() && (ios || android)) { open(); }
})();
</script>
